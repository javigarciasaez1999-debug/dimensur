name: Dimensur News Automation

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Modo de ejecucion
        required: true
        default: dry-run
        type: choice
        options:
          - dry-run
          - publish
      row:
        description: Fila concreta opcional
        required: false
        type: string
  schedule:
    # Una sola ejecución semanal; GitHub ajusta automáticamente verano/invierno.
    # No filtrar por la hora de inicio: el runner puede arrancar con retraso.
    - cron: "0 12 * * 3"
      timezone: Europe/Madrid

permissions:
  contents: read

concurrency:
  group: dimensur-news-automation
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_TEXT_MODEL: gpt-5.5
      OPENAI_IMAGE_MODEL: gpt-image-2
      SHEET_BACKEND: google
      GOOGLE_SHEET_URL: https://docs.google.com/spreadsheets/d/1cXBLoxbZ2KBQkpG1vJMc8aVMfFPJm4nv347DnsdIRw8/edit?usp=sharing
      GOOGLE_SHEET_ID: ""
      GOOGLE_SHEET_NAME: Hoja 1
      GOOGLE_CREDENTIALS_FILE: credentials.json
      GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
      DIMENSUR_API_URL: https://www.dimensur.es/api/news
      DIMENSUR_API_TOKEN: ${{ secrets.DIMENSUR_API_TOKEN }}
      DEFAULT_AUTHOR: Dimensur
      DEFAULT_CATEGORIES: Noticias
      DEFAULT_STATUS: publish
      DRY_RUN: "true"
      GENERATE_IMAGES_IN_DRY_RUN: "false"
      MAX_REGENERATION_ATTEMPTS: "3"
      MIN_CONTENT_WORDS: "900"
      MAX_CONTENT_WORDS: "1600"
      MAX_INTERNAL_LINKS: "4"
      MIN_INTERNAL_LINKS: "2"
      CONTENT_SIMILARITY_THRESHOLD: "0.70"
      IMAGE_SIMILARITY_THRESHOLD: "0.52"
      OPENAI_TIMEOUT_SECONDS: "180"
      DIMENSUR_API_TIMEOUT_SECONDS: "60"
      IMAGE_SIZE: 1536x1024
      IMAGE_QUALITY: medium
      TIMEZONE: Europe/Madrid
      LOG_LEVEL: INFO

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v6

      - name: Preparar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Crear credentials.json
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          credentials = os.environ.get("GOOGLE_CREDENTIALS_JSON", "").strip()
          if not credentials:
              raise SystemExit("Falta el secret GOOGLE_CREDENTIALS_JSON")
          Path("credentials.json").write_text(credentials, encoding="utf-8")
          PY

      - name: Ejecutar automatizacion
        shell: bash
        env:
          INPUT_MODE: ${{ inputs.mode }}
          INPUT_ROW: ${{ inputs.row }}
        run: bash scripts/run_github.sh

      - name: Eliminar credenciales temporales
        if: always()
        run: rm -f credentials.json
